[project]
name = "fluxstate"
version = "0.1.0"
description = "Append-only change-log store for tabular data with point-in-time reconstruction and a temporal viewer."
authors = [{ name = "gyasis", email = "gyasis@gmail.com" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "polars>=1.5.0",
    "orjson>=3.10.7",
    "numpy>=2.1.0",
    "pyarrow>=17.0.0",
    "humanize>=4.10.0",
    "tqdm>=4.66.5",
    # Pre-existing (undeclared) runtime dep: mirror_validator.py uses pydantic.BaseModel
    # and __init__.py imports it unconditionally. Declared so a clean venv imports cleanly
    # (SC-006). NOT a new P1 dependency — surfacing existing usage. See spec U3 remediation.
    "pydantic>=2.0",
]

# Optional, opt-in extras — the CORE stays Polars + PyArrow only (Constitution G1/G8,
# spec SC-004). Platform SDKs / heavy table formats live here, never in `dependencies`.
[project.optional-dependencies]
# Object-store backend (s3 / abfss / gcs / UC Volume) via fsspec.
remote = ["fsspec>=2024.6.0", "s3fs>=2024.6.0", "adlfs>=2024.4.0", "gcsfs>=2024.6.0"]
# First-class table backend. The default Parquet-dataset path needs NEITHER of these;
# they are only pulled when a user selects the Delta/Iceberg format (clarify Q1).
table = ["deltalake>=0.18", "pyiceberg>=0.7"]
# Databricks sidecar (first platform sidecar).
databricks = ["deltalake>=0.18", "databricks-sdk>=0.30"]

[project.scripts]
flux = "flux_cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    # Test-only: proves the .flux/ store is glob-readable by an external engine
    # (STORE-3 / SC-007). NOT a runtime dependency — the runtime stays Polars + PyArrow.
    "duckdb>=1.0",
    "pytz",   # test-only: DuckDB needs it to read tz-aware timestamp parquet columns
    "faker",  # test/demo-only: seeded value source for scripts/demo_fixture.py (US7)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Flat layout: the project is a set of top-level modules plus a `scripts` namespace
# package — there is no single import package matching the project name, so the
# wheel contents are listed explicitly. `dev-mode-dirs` puts the repo root on
# sys.path for editable installs (`uv sync`), which reproduces exactly how the
# test suite imports the flat modules today (see TESTS/conftest.py).
[tool.hatch.build.targets.wheel]
include = [
    "changelog.py",
    "reconstruct.py",
    "fluxstate.py",
    "flux_cli.py",
    "mirror_validator.py",
    "example.py",
    "scripts/",
    "storage/",     # feature 003 — pluggable storage backends (core)
    "sidecars/",    # feature 003 — optional platform sidecars (extras)
]
dev-mode-dirs = ["."]
